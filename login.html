<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Campus Cup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background-color: #fdf2f8; }
        
        .auth-card { background: white; border-radius: 40px; box-shadow: 0 10px 50px rgba(0,0,0,0.05); }
        .input-box { background-color: #fce7f3; border-radius: 16px; padding: 14px 18px; font-weight: 700; color: #1a061e; border: 2px solid transparent; transition: all 0.2s; font-size: 16px; }
        .input-box:focus { outline: none; border-color: #f472b6; background-color: white; }
        
        .btn-gradient { background: linear-gradient(135deg, #1a061e 0%, #2d0a34 100%); transition: transform 0.2s; }
        .btn-gradient:active { transform: scale(0.98); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo Area -->
        <div class="text-center mb-10">
            <div class="inline-block bg-[#1a061e] text-white px-6 py-2 rounded-2xl font-black tracking-tighter text-xl mb-4">
                CAMPUS <span class="text-[#f472b6]">CUP</span>
            </div>
            <h1 class="text-3xl font-black text-[#1a061e] uppercase tracking-tighter">Welcome Back</h1>
            <p class="text-gray-400 font-bold text-sm mt-2">Sign in to access live scores & fan perks</p>
        </div>

        <!-- Login Card -->
        <div class="auth-card p-8 md:p-10">
            <form class="space-y-6">
                <div>
                    <label class="block text-[10px] font-black text-[#be185d] uppercase tracking-widest mb-2 ml-1">Email Address</label>
                    <input type="email" id="email" placeholder="user@example.com" class="input-box w-full">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-[#be185d] uppercase tracking-widest mb-2 ml-1">Password</label>
                    <input type="password" id="password" placeholder="••••••••" class="input-box w-full">
                </div>

                <div class="flex justify-end">
                    <a href="#" class="text-xs font-bold text-pink-500 hover:text-pink-600">Forgot Password?</a>
                </div>

                <button type="button" onclick="doLogin()" class="btn-gradient w-full text-white py-4 rounded-[20px] font-black uppercase tracking-widest shadow-xl shadow-[#1a061e]/20 mt-4">
                    Sign In
                </button>
            </form>

            <div class="mt-10 pt-8 border-t border-gray-50 text-center">
                <p class="text-gray-400 font-bold text-xs">New to Campus Cup?</p>
                <a href="signup.html" class="inline-block mt-2 text-[#1a061e] font-black uppercase tracking-widest text-xs border-b-2 border-pink-500 pb-1">Create Account</a>
            </div>
        </div>

        <p class="text-center mt-8 text-gray-300 font-bold text-[10px] uppercase tracking-[0.2em]">&copy; 2026 Campus Cup Live</p>
    </div>

    <script src="supabase.js"></script>
    <script>
        async function doLogin() {
            const sb = await getSupabase();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert('Please enter your credentials');
                return;
            }

            try {
                const { data, error } = await sb.auth.signInWithPassword({ email, password });
                if (error) throw error;

                const { data: profiles } = await sb.from('profiles').select('*').eq('id', data.user.id).limit(1);
                const profile = profiles && profiles.length > 0 ? profiles[0] : null;

                const userData = {
                    id: data.user.id,
                    firstName: profile?.first_name || 'User',
                    lastName: profile?.last_name || '',
                    email: email,
                    isAdmin: profile?.is_admin || false
                };

                localStorage.setItem('currentUser', JSON.stringify(userData));
                window.location.href = 'index.html';
            } catch (err) {
                alert(err.message);
            }
        }
    </script>
</body>
</html>
