<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile - Campus Cup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { overflow-x: hidden; width: 100%; }
        body { font-family: 'Inter', sans-serif; background-color: #fdf2f8; }
        
        .profile-card { background: white; border-radius: 32px; box-shadow: 0 4px 25px rgba(0,0,0,0.02); }
        .avatar-glow { box-shadow: 0 0 20px rgba(244, 114, 182, 0.2); }

        #mobile-overlay { transition: opacity 0.3s ease; }
        #mobile-menu-panel { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #fdf2f8; }
        ::-webkit-scrollbar-thumb { background: #f472b6; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Navigation -->
    <nav class="sticky top-0 z-50 shadow-lg" style="background-color: #1a061e;">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex-shrink-0">
                    <a href="index.html" class="text-xl font-black tracking-tighter" style="color: #fef2f8;">
                        CAMPUS <span style="color: #f472b6;">CUP</span>
                    </a>
                </div>
                
                <!-- Desktop Menu -->
                <div class="hidden md:flex items-center space-x-1">
                    <a href="index.html" class="text-[#fef2f8] hover:text-[#f472b6] text-sm font-bold px-4 py-2 transition-colors">Dashboard</a>
                    <a href="teams.html" class="text-[#fef2f8] hover:text-[#f472b6] text-sm font-bold px-4 py-2 transition-colors">Teams</a>
                    <a href="standings.html" class="text-[#fef2f8] hover:text-[#f472b6] text-sm font-bold px-4 py-2 transition-colors">Standings</a>
                    <a href="match-history.html" class="text-[#fef2f8] hover:text-[#f472b6] text-sm font-bold px-4 py-2 transition-colors">History</a>
                    <a href="profile.html" class="bg-[#f472b6] text-[#1a061e] text-sm font-black px-4 py-2 rounded-lg">Profile</a>
                    <a href="admin.html" id="admin-link" class="text-[#fef2f8] hover:text-[#f472b6] text-sm font-bold px-4 py-2 hidden">Admin</a>
                    <button onclick="logout()" class="text-white bg-red-500/20 hover:bg-red-500/40 px-4 py-2 rounded-lg text-sm font-bold ml-4 transition-all">Logout</button>
                </div>

                <!-- Mobile Menu Button -->
                <div class="md:hidden flex items-center">
                    <button onclick="toggleMobileMenu()" class="text-[#fef2f8] p-2 focus:outline-none">
                        <i class="fas fa-bars text-2xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Mobile Menu Overlay -->
    <div id="mobile-overlay" class="fixed inset-0 bg-black/60 z-[60] hidden opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="mobile-menu-panel" class="absolute right-0 top-0 h-full w-4/5 max-w-sm bg-[#1a061e] shadow-2xl translate-x-full transition-transform duration-300 p-6 flex flex-col">
            <div class="flex justify-between items-center mb-10">
                <span class="text-xl font-black text-white">MENU</span>
                <button onclick="toggleMobileMenu()" class="text-[#f472b6] p-2">
                    <i class="fas fa-times text-2xl"></i>
                </button>
            </div>
            <div class="flex flex-col space-y-4">
                <a href="index.html" class="text-white text-lg font-bold p-3 rounded-xl hover:bg-white/10 transition-colors"><i class="fas fa-th-large mr-3 w-6"></i> Dashboard</a>
                <a href="teams.html" class="text-white text-lg font-bold p-3 rounded-xl hover:bg-white/10 transition-colors"><i class="fas fa-users mr-3 w-6"></i> Teams</a>
                <a href="standings.html" class="text-white text-lg font-bold p-3 rounded-xl hover:bg-white/10 transition-colors"><i class="fas fa-list-ol mr-3 w-6"></i> Standings</a>
                <a href="match-history.html" class="text-white text-lg font-bold p-3 rounded-xl hover:bg-white/10 transition-colors"><i class="fas fa-history mr-3 w-6"></i> History</a>
                <a href="profile.html" class="text-[#f472b6] text-lg font-black p-3 rounded-xl bg-white/5"><i class="fas fa-user mr-3 w-6"></i> Profile</a>
                <a href="admin.html" id="admin-link-mobile" class="text-white text-lg font-bold p-3 rounded-xl hover:bg-white/10 transition-colors hidden"><i class="fas fa-user-shield mr-3 w-6"></i> Admin Panel</a>
                <div class="pt-10">
                    <button onclick="logout()" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-red-600/20">
                        <i class="fas fa-sign-out-alt mr-2"></i> LOGOUT
                    </button>
                </div>
            </div>
        </div>
    </div>

    <main class="flex-grow p-4 md:p-8 lg:p-12 max-w-4xl mx-auto w-full">
        <div class="profile-card overflow-hidden">
            <!-- Profile Header -->
            <div class="bg-gradient-to-br from-[#1a061e] to-[#2d0a34] p-8 md:p-12 text-center relative">
                <div class="absolute inset-0 bg-pink-500/5 backdrop-blur-[2px]"></div>
                <div class="relative z-10">
                    <div id="profile-avatar" class="w-24 h-24 md:w-32 md:h-32 bg-pink-500 rounded-[32px] flex items-center justify-center text-white text-3xl md:text-5xl font-black mx-auto mb-6 avatar-glow border-4 border-white/10">
                        JD
                    </div>
                    <h2 id="profile-name" class="text-2xl md:text-4xl font-black text-white uppercase tracking-tighter mb-2">Loading Profile...</h2>
                    <p id="profile-email" class="text-pink-300 font-bold text-xs md:text-sm tracking-widest uppercase mb-6 opacity-80">user@example.com</p>
                    
                    <div class="flex justify-center gap-2">
                        <span id="role-badge" class="bg-white/10 text-white px-4 py-1 rounded-full text-[10px] font-black uppercase tracking-widest border border-white/10">Member</span>
                        <span id="admin-badge" class="bg-pink-500 text-white px-4 py-1 rounded-full text-[10px] font-black uppercase tracking-widest hidden">Admin</span>
                    </div>
                </div>
            </div>

            <!-- Profile Info Grid -->
            <div class="p-8 md:p-12 grid grid-cols-1 md:grid-cols-2 gap-8 bg-white">
                <div class="space-y-6">
                    <h3 class="text-xs font-black text-pink-500 uppercase tracking-widest mb-4">Account Overview</h3>
                    <div class="bg-gray-50 p-5 rounded-2xl border border-gray-100 group hover:border-pink-100 transition-colors">
                        <p class="text-[9px] font-black text-gray-400 uppercase mb-1">Display Name</p>
                        <p id="info-name" class="font-black text-[#1a061e] text-sm">--</p>
                    </div>
                    <div class="bg-gray-50 p-5 rounded-2xl border border-gray-100 group hover:border-pink-100 transition-colors">
                        <p class="text-[9px] font-black text-gray-400 uppercase mb-1">Email Address</p>
                        <p id="info-email" class="font-black text-[#1a061e] text-sm">--</p>
                    </div>
                </div>

                <div class="space-y-6">
                    <h3 class="text-xs font-black text-pink-500 uppercase tracking-widest mb-4">System Settings</h3>
                    <button class="w-full flex justify-between items-center p-5 bg-gray-50 rounded-2xl font-black text-[#1a061e] hover:bg-pink-50 transition-all border border-gray-100">
                        <span class="text-sm">Notification Preferences</span>
                        <i class="fas fa-chevron-right text-pink-300"></i>
                    </button>
                    <button class="w-full flex justify-between items-center p-5 bg-gray-50 rounded-2xl font-black text-[#1a061e] hover:bg-pink-50 transition-all border border-gray-100">
                        <span class="text-sm">Privacy & Security</span>
                        <i class="fas fa-chevron-right text-pink-300"></i>
                    </button>
                    <button onclick="logout()" class="w-full flex justify-between items-center p-5 bg-red-50 rounded-2xl font-black text-red-600 hover:bg-red-100 transition-all border border-red-100">
                        <span class="text-sm">Sign Out Account</span>
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="supabase.js"></script>
    <script>
        function toggleMobileMenu() {
            const overlay = document.getElementById('mobile-overlay');
            const panel = document.getElementById('mobile-menu-panel');
            const isHidden = overlay.classList.contains('hidden');
            
            if (isHidden) {
                overlay.classList.remove('hidden');
                setTimeout(() => {
                    overlay.classList.remove('opacity-0');
                    overlay.classList.add('opacity-100');
                    overlay.classList.add('pointer-events-auto');
                    panel.classList.remove('translate-x-full');
                }, 10);
            } else {
                overlay.classList.add('opacity-0');
                overlay.classList.remove('opacity-100');
                overlay.classList.remove('pointer-events-auto');
                panel.classList.add('translate-x-full');
                setTimeout(() => {
                    overlay.classList.add('hidden');
                }, 300);
            }
        }

        async function checkAuth() {
            const sb = await getSupabase();
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return null; }
            const { data: profiles } = await sb.from('profiles').select('*').eq('id', session.user.id).limit(1);
            const profile = profiles && profiles.length > 0 ? profiles[0] : null;
            if (!profile) return { id: session.user.id, email: session.user.email, isAdmin: false };
            
            const userData = { id: profile.id, firstName: profile.first_name, lastName: profile.last_name, email: profile.email, isAdmin: profile.is_admin };
            try {
                localStorage.setItem('currentUser', JSON.stringify(userData));
            } catch (e) {
                console.warn('LocalStorage access blocked');
            }
            return profile;
        }

        async function logout() {
            const sb = await getSupabase();
            await sb.auth.signOut();
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        }

        async function loadProfile() {
            const profile = await checkAuth();
            if (!profile) return;
            
            const name = `${profile.first_name} ${profile.last_name}`;
            document.getElementById('profile-name').textContent = name;
            document.getElementById('info-name').textContent = name;
            document.getElementById('profile-email').textContent = profile.email;
            document.getElementById('info-email').textContent = profile.email;
            document.getElementById('profile-avatar').textContent = (profile.first_name[0] + profile.last_name[0]).toUpperCase();
            
            if (profile.is_admin) {
                document.getElementById('admin-badge').classList.remove('hidden');
                document.getElementById('admin-link')?.classList.remove('hidden');
                document.getElementById('admin-link-mobile')?.classList.remove('hidden');
                document.getElementById('role-badge').textContent = profile.is_permanent_admin ? 'Owner' : 'Admin';
            }
        }

        document.documentElement.classList.remove('dark-mode');
        localStorage.removeItem('darkMode');

        loadProfile();
    </script>
</body>
</html>
