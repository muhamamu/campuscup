<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League Standings - Campus Cup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: white; }
        
        /* Dark Mode Styles */
        .dark-mode body {
            background-color: #000000;
        }
        
        .dark-mode .dark-bg-white {
            background-color: #111111 !important;
        }
        
        .dark-mode .dark-text-primary {
            color: #ffffff !important;
        }
        
        .dark-mode .dark-text-secondary {
            color: #9ca3af !important;
        }
        
        .dark-mode .dark-card-bg {
            background-color: #1f1f1f !important;
        }
        
        .dark-mode .standings-card {
            background-color: #111111;
        }
        .dark-mode .standings-card td,
        .dark-mode .standings-card span {
            color: #ffffff !important;
        }
        .dark-mode .standings-card .text-gray-500 {
            color: #9ca3af !important;
        }
        
        .nav-link { color: #fef2f8; font-weight: 500; font-size: 0.875rem; padding: 0.5rem 1rem; transition: all 0.2s; cursor: pointer; border: 1px solid transparent; }
        .nav-link:hover { color: #f472b6; }
        .nav-link-active { color: #1a061e; border: 1px solid #f472b6; border-radius: 8px; background-color: white; }
        
        .dark-mode .nav-link {
            color: #9ca3af;
        }
        .dark-mode .nav-link:hover {
            color: #ffffff;
        }
        .dark-mode .nav-link-active {
            color: #ffffff;
            border-color: #f472b6;
            background-color: #2a2a4a;
        }
        
        .search-input { background-color: #fce7f3; }
        .dark-mode .search-input { background-color: #2a2a4a; color: #ffffff; }
        
        .standings-card { background-color: #fce7f3; border-radius: 16px; overflow: hidden; }
        .dark-mode .standings-card {
            background-color: #1a1a2e;
        }
        
        .form-dot { width: 24px; height: 24px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: white; }
        .form-w { background-color: #10b981; }
        .form-d { background-color: #94a3b8; }
        .form-l { background-color: #ef4444; }
        .table-header { color: #be185d; font-size: 11px; font-weight: 800; text-transform: uppercase; }
        #mobile-menu { transition: transform 0.3s ease-in-out; transform: translateX(-100%); }
        #mobile-menu.active { transform: translateX(0); }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden">
    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <main class="flex-grow p-4 md:p-12 max-w-7xl mx-auto w-full">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-10 gap-6">
            <div>
                <h1 class="text-4xl md:text-5xl font-black text-[#1a061e] uppercase tracking-tighter mb-2">LEAGUE STANDINGS</h1>
                <p class="text-gray-400 font-bold">2026 Regular Season</p>
            </div>
            <div class="flex space-x-4">
                <button class="bg-white border border-pink-100 px-6 py-2 rounded-lg text-xs font-bold text-[#1a061e] shadow-sm hover:bg-pink-50 transition-colors">All Conferences</button>
                <button class="bg-[#1a061e] text-white px-6 py-2 rounded-lg text-xs font-bold flex items-center space-x-2 shadow-lg hover:bg-black transition-colors"><i class="fas fa-file-export"></i><span>EXPORT</span></button>
            </div>
        </div>

        <div class="standings-card shadow-xl overflow-x-auto">
            <table class="w-full text-left min-w-[900px]">
                <thead>
                    <tr class="bg-pink-100/50">
                        <th class="table-header px-6 py-6 w-16">POS</th>
                        <th class="table-header px-6 py-6">CLUB</th>
                        <th class="table-header px-4 py-6 text-center">MP</th>
                        <th class="table-header px-4 py-6 text-center">W</th>
                        <th class="table-header px-4 py-6 text-center">D</th>
                        <th class="table-header px-4 py-6 text-center">L</th>
                        <th class="table-header px-4 py-6 text-center">GF</th>
                        <th class="table-header px-4 py-6 text-center">GA</th>
                        <th class="table-header px-4 py-6 text-center">GD</th>
                        <th class="table-header px-6 py-6 text-center">PTS</th>
                        <th class="table-header px-6 py-6 text-center">FORM</th>
                    </tr>
                </thead>
                <tbody id="standings-body" class="divide-y divide-pink-100/50 font-bold">
                </tbody>
            </table>
            <div class="p-6 bg-pink-50/50 flex flex-wrap gap-6 border-t border-pink-100/50">
                <div class="flex items-center space-x-2"><div class="w-3 h-3 rounded-full bg-red-500"></div><span class="text-[10px] font-bold text-gray-400 uppercase">Champions League Qualification</span></div>
                <div class="flex items-center space-x-2"><div class="w-3 h-3 rounded-full bg-gray-300"></div><span class="text-[10px] font-bold text-gray-400 uppercase">Europa League Qualification</span></div>
            </div>
        </div>
    </main>

    <script src="supabase.js"></script>
    <script src="navbar.js"></script>
    <script src="game-manager.js"></script>
    <script>
        function checkAuth() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser) {
                window.location.href = 'login.html';
                return false;
            }
            return currentUser;
        }

        function checkAdmin() {
            const currentUser = checkAuth();
            if (!currentUser) return;
            
            const adminLinks = document.querySelectorAll('[href="admin.html"]');
            adminLinks.forEach(link => {
                if (!currentUser.isAdmin) {
                    link.classList.add('hidden');
                } else {
                    link.classList.remove('hidden');
                }
            });
        }

        // Run on load
        const user = checkAuth();
        if (user) {
            loadNavbar('standings');
            checkAdmin();
        }

        function renderStandings(standings) {
            const tbody = document.getElementById('standings-body');
            if (!tbody) return;

            tbody.innerHTML = standings.map(standing => {
                const formDots = standing.form.map(f => {
                    const className = f.result === 'W' ? 'form-w' : f.result === 'D' ? 'form-d' : 'form-l';
                    return `<div class="form-dot ${className}">${f.result}</div>`;
                }).join('');

                const posColor = standing.pos <= 2 ? 'text-red-500' : 'text-[#1a061e]';
                const gdColor = standing.gd > 0 ? 'text-green-500' : standing.gd < 0 ? 'text-red-500' : 'text-gray-500';

                return `
                    <tr class="hover:bg-pink-50/50 transition-colors">
                        <td class="px-6 py-6 ${posColor} text-xl font-black">${standing.pos}</td>
                        <td class="px-6 py-6 flex items-center space-x-4">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center border-2 border-orange-500 overflow-hidden">
                                <div class="w-full h-full flex items-center justify-center text-[10px] text-white" style="background-color: ${standing.team.logoBg}">${standing.team.logoText}</div>
                            </div>
                            <span class="text-[#1a061e] text-lg">${standing.team.name}</span>
                        </td>
                        <td class="px-4 py-6 text-center text-gray-500">${standing.mp}</td>
                        <td class="px-4 py-6 text-center text-gray-500">${standing.w}</td>
                        <td class="px-4 py-6 text-center text-gray-500">${standing.d}</td>
                        <td class="px-4 py-6 text-center text-gray-500">${standing.l}</td>
                        <td class="px-4 py-6 text-center text-gray-500">${standing.gf}</td>
                        <td class="px-4 py-6 text-center text-gray-500">${standing.ga}</td>
                        <td class="px-4 py-6 text-center ${gdColor}">${standing.gd > 0 ? '+' : ''}${standing.gd}</td>
                        <td class="px-6 py-6 text-center text-[#1a061e] text-2xl font-black">${standing.pts}</td>
                        <td class="px-6 py-6">
                            <div class="flex space-x-1 justify-center">${formDots}</div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Run on load
        loadTheme();
        checkAdmin();

        // Subscribe to game manager updates
        if (typeof gameManager !== 'undefined') {
            gameManager.subscribe((standings, match) => {
                renderStandings(standings);
            });
        }
    </script>
</body>
</html>
