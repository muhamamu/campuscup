<!DOCTYPE html>
<html>
<head>
    <title>TEST SIGNUP</title>
    <style>
        body { font-family: Arial; max-width: 500px; margin: 50px auto; padding: 20px; background: #fdf2f8; }
        button { background: #1a061e; color: white; border: none; padding: 15px 30px; font-size: 18px; cursor: pointer; margin: 10px 0; width: 100%; }
        .test-btn { background: #22c55e; }
        input { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; }
    </style>
</head>
<body>
    <h1>TEST SIGNUP PAGE</h1>

    <button class="test-btn" onclick="alert('✅ TEST BUTTON WORKED! JAVASCRIPT IS OK!')">
        🟢 CLICK THIS TEST BUTTON FIRST!
    </button>

    <hr>

    <h2>Sign Up Form</h2>
    <input type="text" id="fname" placeholder="First Name">
    <input type="text" id="lname" placeholder="Last Name">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="doSignup()">SIGN UP</button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://zpciirbchnejpupgapcr.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_b3XbVn4zL26XFCkgg7I5-Q_5J80jsWU';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function doSignup() {
            alert('Starting signup...');
            console.log('Starting signup...');

            const firstName = document.getElementById('fname').value;
            const lastName = document.getElementById('lname').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                alert('Checking users...');
                const { data: users } = await sb.from('users').select('*');
                const count = users ? users.length : 0;
                const isAdmin = count === 0;
                alert('User count: ' + count + ', isAdmin: ' + isAdmin);

                alert('Signing up auth user...');
                const { data, error } = await sb.auth.signUp({ email, password });
                if (error) throw error;

                alert('Saving to users table...');
                await sb.from('users').insert({
                    id: data.user.id,
                    first_name: firstName,
                    last_name: lastName,
                    email: email,
                    password: password,
                    is_admin: isAdmin,
                    is_permanent_admin: isAdmin
                });

                alert('✅ DONE! Now go to login.html');
                window.location.href = 'login.html';

            } catch (err) {
                console.error(err);
                alert('❌ ERROR: ' + err.message);
            }
        }
    </script>
</body>
</html>
